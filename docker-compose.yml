services:
  app:
    build:
      context: .
      args:
        VITE_AUTH_URL: ${VITE_AUTH_URL:-https://auth.carlezia.fr}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4002:4000" # écoute seulement en local : Caddy fait le pont vers l'extérieur (HTTPS)
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
